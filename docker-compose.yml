version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag_network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag_network

  # Numele serviciului/containerului este "embedder" (nu "embedder-service")
  # pentru ca backend-ul Spring Boot il gaseste implicit la http://embedder:8001
  # (vezi app.rag.embedder-url / RAG_EMBEDDER_URL in akadion/backend).
  #
  # Reteaua "akadion_shared" e externa si trebuie sa existe inainte de
  # "docker-compose up" — launcherul din akadion (Start Akadion.cmd) o
  # creeaza automat; daca pornesti embedder-ul separat, ruleaza intai:
  #   docker network create akadion_shared
  # Vezi README > "Rulare integrata cu akadion" pentru valorile .env
  # (MINIO_ENDPOINT, MINIO_BUCKET, RAG_SERVICE_USERNAME/PASSWORD) necesare
  # ca backend-ul sa poata efectiv sa vorbeasca cu acest serviciu.
  embedder:
    build:
        context: .
        dockerfile: Dockerfile.multistage
    container_name: embedder
    ports:
      - "8001:8001"
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-documents}
      - BGE_MODEL_PATH=${BGE_MODEL_PATH:-BAAI/bge-m3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RAG_SERVICE_USERNAME=${RAG_SERVICE_USERNAME}
      - RAG_SERVICE_PASSWORD=${RAG_SERVICE_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_REQUEST_DELAY_SECONDS=${GEMINI_REQUEST_DELAY_SECONDS:-13.0}
      - MIN_IMAGE_WIDTH=${MIN_IMAGE_WIDTH:-100}
      - MIN_IMAGE_HEIGHT=${MIN_IMAGE_HEIGHT:-100}
      - MAX_IMAGES_PER_DOCUMENT=${MAX_IMAGES_PER_DOCUMENT:-20}
      - SPRING_BOOT_CALLBACK_URL=${SPRING_BOOT_CALLBACK_URL}
      - SPRING_BOOT_CALLBACK_USERNAME=${SPRING_BOOT_CALLBACK_USERNAME}
      - SPRING_BOOT_CALLBACK_PASSWORD=${SPRING_BOOT_CALLBACK_PASSWORD}
    depends_on:
      - qdrant
      - minio
    volumes:
      - model_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - rag_network
      - akadion_shared

volumes:
  qdrant_data:
  minio_data:
  model_cache:

networks:
  rag_network:
    external: true
  akadion_shared:
    external: true